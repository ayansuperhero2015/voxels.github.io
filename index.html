<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/hub.css">
  <link rel="stylesheet" href="css/avatar.css">
  <link rel="stylesheet" href="css/marketplace.css">
  <link rel="stylesheet" href="css/friends.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="screen active">
    <div class="auth-bg">
      <div class="floating-cubes"></div>
    </div>
    <div class="auth-container">
      <div class="logo-wrap">
        <div class="logo-icon">⬡</div>
        <h1 class="logo-text">VOXELS</h1>
        <p class="logo-sub">Build. Explore. Play.</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>
      <div id="login-form" class="auth-form active">
        <input type="text" id="login-username" placeholder="Username" class="auth-input">
        <input type="password" id="login-password" placeholder="Password" class="auth-input">
        <button class="btn-primary" id="login-btn">Log In</button>
        <div class="auth-error" id="login-error"></div>
      </div>
      <div id="signup-form" class="auth-form">
        <input type="text" id="signup-username" placeholder="Username" class="auth-input">
        <input type="email" id="signup-email" placeholder="Email" class="auth-input">
        <input type="password" id="signup-password" placeholder="Password" class="auth-input">
        <button class="btn-primary" id="signup-btn">Create Account</button>
        <div class="auth-error" id="signup-error"></div>
      </div>
      <div class="guest-divider"><span>or</span></div>
      <button class="btn-guest" id="guest-btn">Join as Guest</button>
    </div>
  </div>

  <!-- Hub Screen -->
  <div id="hub-screen" class="screen">
    <!-- Top Nav -->
    <nav class="hub-nav">
      <div class="nav-logo">⬡ VOXELS</div>
      <div class="nav-links">
        <button class="nav-btn active" data-page="home">🏠 Home</button>
        <button class="nav-btn" data-page="marketplace" id="nav-marketplace">🛒 Marketplace</button>
        <button class="nav-btn" data-page="friends" id="nav-friends">👥 Friends</button>
        <button class="nav-btn" data-page="avatar" id="nav-avatar">🧍 Avatar</button>
      </div>
      <div class="nav-user">
        <div class="nav-voxbux" id="nav-voxbux">🪙 <span id="voxbux-display">0</span></div>
        <div class="nav-avatar-mini" id="nav-avatar-mini"></div>
        <span id="nav-username">Guest</span>
        <button class="btn-logout" id="logout-btn">Logout</button>
      </div>
    </nav>

    <!-- Pages -->
    <div id="page-home" class="hub-page active"></div>
    <div id="page-marketplace" class="hub-page"></div>
    <div id="page-friends" class="hub-page"></div>
    <div id="page-avatar" class="hub-page"></div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <canvas id="game-canvas"></canvas>
    <div id="game-ui">
      <div id="game-header">
        <button id="leave-game-btn">← Leave Game</button>
        <span id="game-title-display"></span>
        <div id="player-count">👤 <span id="player-count-num">1</span></div>
      </div>
      <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-row">
          <input type="text" id="chat-input" placeholder="Press Enter to chat..." maxlength="120">
          <button id="chat-send">Send</button>
        </div>
      </div>
      <div id="game-controls-hint">WASD / Arrow Keys to move · Mouse to look · Space to jump</div>
    </div>
  </div>

  <!-- Game Detail Modal -->
  <div id="game-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-game-image" class="modal-game-img"></div>
      <h2 id="modal-game-title"></h2>
      <p class="modal-made-by">Made by <strong>Voxels</strong></p>
      <p id="modal-game-desc"></p>
      <button class="btn-primary btn-play" id="modal-play-btn">▶ Play Now</button>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/hub.js"></script>
  <script type="module" src="js/home.js"></script>
  <script type="module" src="js/marketplace.js"></script>
  <script type="module" src="js/friends.js"></script>
  <script type="module" src="js/avatar-editor.js"></script>
  <script type="module" src="js/game-engine.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
